services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        image: lms-app:latest
        container_name: lms-app

        env_file:
            - .env

        expose:
            - "80"

        volumes:
            - app_storage:/var/www/storage
            - app_bootstrap_cache:/var/www/bootstrap/cache

        networks:
            - lms-internal

        depends_on:
            db:
                condition: service_healthy

        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-f",
                    "http://localhost:80/up"
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

        restart: unless-stopped

    queue:
        image: lms-app:latest
        container_name: lms-queue

        env_file:
            - .env

        command:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --max-time=3600

        volumes:
            - app_storage:/var/www/storage
            - app_bootstrap_cache:/var/www/bootstrap/cache

        depends_on:
            app:
                condition: service_healthy

        networks:
            - lms-internal

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pgrep -f 'queue:work' > /dev/null || exit 1"
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

        restart: unless-stopped

    scheduler:
        image: lms-app:latest
        container_name: lms-scheduler

        env_file:
            - .env

        command:
            - php
            - artisan
            - schedule:work

        volumes:
            - app_storage:/var/www/storage
            - app_bootstrap_cache:/var/www/bootstrap/cache

        depends_on:
            app:
                condition: service_healthy

        networks:
            - lms-internal

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pgrep -f 'schedule:work' > /dev/null || exit 1"
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

        restart: unless-stopped

    db:
        image: mariadb:11
        container_name: lms-db

        env_file:
            - .env

        expose:
            - "3306"

        volumes:
            - db_data:/var/lib/mysql

        networks:
            - lms-internal

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

        restart: unless-stopped

networks:
    lms-internal:
        driver: bridge

volumes:
    app_storage:
    app_bootstrap_cache:
    db_data:
